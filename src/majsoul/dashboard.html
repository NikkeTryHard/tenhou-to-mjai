<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef1f7;font:16px/1.5 system-ui,sans-serif;padding:40px 24px}main{max-width:760px;margin:auto}h1{font-size:clamp(64px,16vw,104px);line-height:1;margin:0 0 24px;font-variant-numeric:tabular-nums;letter-spacing:-.06em;font-weight:600}.bar{height:6px;background:#232a3b;border-radius:8px;overflow:hidden;margin-bottom:30px}.bar i{display:block;background:#7dd3a8;height:100%;width:0;transition:width .6s}dl{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:0}dt,.label{color:#8b93a7;font-size:13px}dd{margin:2px 0 0;font-size:23px;font-variant-numeric:tabular-nums}#status{font-size:12px;color:#8b93a7;min-height:18px;margin:18px 0}.graphs{display:grid;grid-template-columns:1fr 1fr;gap:22px}.chart{min-width:0}.chart:first-child{grid-column:1/-1}.label{display:flex;justify-content:space-between;margin-bottom:6px}.label b{font-weight:400;color:#eef1f7}canvas{width:100%;height:90px;display:block;cursor:crosshair}.chart:first-child canvas{height:150px}.axis{display:flex;justify-content:space-between;color:#687186;font-size:11px}#tip{position:fixed;display:none;pointer-events:none;z-index:2;background:#191e2b;border:1px solid #394257;border-radius:6px;padding:7px 10px;font-size:12px;white-space:pre;box-shadow:0 4px 20px #0008}@media(max-width:600px){dl{grid-template-columns:1fr 1fr}.graphs{grid-template-columns:1fr}}
</style></head><body><main>
<h1 id="pct">—</h1><div class="bar"><i id="bar"></i></div><dl><div><dt>ETA · estimated</dt><dd id="eta">Starting…</dd></div><div><dt>Left · estimated</dt><dd id="left">—</dd></div><div><dt>IDs/s</dt><dd id="rate">—</dd></div><div><dt>Total · estimated</dt><dd id="total">—</dd></div></dl><div id="status"></div><div class="graphs" id="graphs"></div></main><div id="tip"></div>
<script>
const $=id=>document.getElementById(id),number=n=>n==null?'—':new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:2}).format(n);
const colors=['#7dd3a8','#5aa9ff','#ffcf6e','#c48bff','#ffa0a0','#6edcdc'];let history=null;
function duration(s){if(s==null)return 'Waiting for output';if(s<60)return '<1 min';const m=Math.ceil(s/60),h=Math.floor(m/60),d=Math.floor(h/24);return d?`${d}d ${h%24}h`:h?`${h}h ${m%60}m`:`${m} min`}
const time=t=>new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function paint(cv,index,hover=null){const rect=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);const x=cv.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=rect.height,points=history.points;if(!points.length)return;const first=points[0].t,last=points.at(-1).t,span=Math.max(1,last-first),max=Math.max(1,...points.map(p=>p.v[index]));const px=p=>(p.t-first)/span*w,py=p=>h-4-p.v[index]/max*(h-18);x.strokeStyle='#232a3b';x.beginPath();x.moveTo(0,h-3);x.lineTo(w,h-3);x.stroke();x.strokeStyle=colors[index%colors.length];x.lineWidth=1.5;x.beginPath();points.forEach((p,i)=>i?x.lineTo(px(p),py(p)):x.moveTo(px(p),py(p)));x.stroke();x.fillStyle='#8b93a7';x.font='11px system-ui';x.fillText(number(max)+'/s',4,12);if(hover!=null){const p=points[hover];x.strokeStyle='#8b93a7';x.beginPath();x.moveTo(px(p),0);x.lineTo(px(p),h);x.stroke();x.fillStyle=colors[index%colors.length];x.beginPath();x.arc(px(p),py(p),3,0,Math.PI*2);x.fill();}}
function render(){if(!history)return;if(!$('graphs').children.length){history.series.forEach((name,index)=>{const card=document.createElement('section');card.className='chart';const label=document.createElement('div');label.className='label';const title=document.createElement('span');title.textContent=name==='Paipu ids'?'Paipu IDs · history':name;const value=document.createElement('b');label.append(title,value);const cv=document.createElement('canvas');cv.setAttribute('aria-label',name+' throughput history');const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<span></span><span></span>';card.append(label,cv,axis);$('graphs').append(card);cv.onpointermove=e=>{if(!history.points.length)return;const rect=cv.getBoundingClientRect(),p=history.points,seek=p[0].t+(e.clientX-rect.left)/rect.width*(p.at(-1).t-p[0].t);let nearest=0;for(let i=1;i<p.length;i++)if(Math.abs(p[i].t-seek)<Math.abs(p[nearest].t-seek))nearest=i;paint(cv,index,nearest);$('tip').textContent=new Date(p[nearest].t*1000).toLocaleString()+'\n'+name+': '+p[nearest].v[index].toFixed(1)+'/s';$('tip').style.display='block';$('tip').style.left=Math.max(4,Math.min(innerWidth-$('tip').offsetWidth-8,e.clientX+12))+'px';$('tip').style.top=Math.max(4,Math.min(innerHeight-$('tip').offsetHeight-8,e.clientY+12))+'px';};cv.onpointerleave=()=>{$('tip').style.display='none';paint(cv,index);};});}Array.from($('graphs').children).forEach((card,index)=>{const points=history.points;card.querySelector('b').textContent=points.length?points.at(-1).v[index].toFixed(1)+'/s':'—';const axis=card.querySelector('.axis');axis.firstChild.textContent=points.length?time(points[0].t):'';axis.lastChild.textContent=points.length?time(points.at(-1).t):'';paint(card.querySelector('canvas'),index);});}
async function tick(){try{const r=await fetch('/api/stats',{cache:'no-store'});if(!r.ok)throw Error('stats unavailable');const s=await r.json(),ready=s.estimated_total!=null;$('pct').textContent=ready?s.progress_pct.toFixed(1)+'%':'—';$('bar').style.width=(ready?Math.min(100,s.progress_pct):0)+'%';$('left').textContent=number(s.remaining_estimate);$('total').textContent=number(s.estimated_total);$('rate').textContent=s.rate_ready?s.paipu_rate.toFixed(1):'—';$('eta').textContent=ready?duration(s.eta_secs):'Starting…';$('status').textContent=ready?'':'Loading campaign coverage…';}catch(e){$('status').textContent='Disconnected';$('rate').textContent='—';$('eta').textContent='—';}}
async function loadHistory(){try{const r=await fetch('/api/history',{cache:'no-store'});if(!r.ok)return;history=await r.json();render();}catch(e){}}
tick();loadHistory();setInterval(tick,2000);setInterval(loadHistory,10000);addEventListener('resize',render);
</script></body></html>
