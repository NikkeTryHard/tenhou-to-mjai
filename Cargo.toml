[package]
name = "tenhou-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["gzip", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = { version = "0.17", features = ["rayon"] }
rayon = "1.10"
regex = "1"
chrono = "0.4"
zip = "2"
walkdir = "2"
futures = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
chromiumoxide = { version = "0.8", features = ["tokio-runtime"], default-features = false }
base64 = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

# Vendored crates
mjlog = { path = "crates/mjlog" }
tenhou-json = { path = "crates/tenhou-json" }
mjlog2json-core = { path = "crates/mjlog2json-core" }
convlog = { path = "crates/convlog" }

[workspace]
members = [
    ".",
    "crates/mjlog",
    "crates/tenhou-json",
    "crates/mjlog2json-core",
    "crates/convlog",
]
