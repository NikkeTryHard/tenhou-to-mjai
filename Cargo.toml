[package]
name = "tenhou-scraper"
version = "0.1.0"
edition = "2021"
description = "Scrape Tenhou and Majsoul mahjong logs and convert them to MJAI format"
license = "Apache-2.0"
repository = "https://github.com/NikkeTryHard/tenhou-to-mjai"
rust-version = "1.98.1"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "native-tls"] } # native-tls: preserve 0.12 default-TLS behavior (0.13 flips default to rustls)
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = "1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = { version = "0.18", features = ["rayon"] }
rayon = "1.10"
regex = "1"
chrono = "0.4"
zip = "8"
walkdir = "2"
futures = "0.3"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
chromiumoxide = "0.9"
base64 = "0.23"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Vendored crates
mjlog = { path = "crates/mjlog" }
tenhou-json = { path = "crates/tenhou-json" }
mjlog2json-core = { path = "crates/mjlog2json-core" }
convlog = { path = "crates/convlog" }

[workspace]
members = [
    ".",
    "crates/mjlog",
    "crates/tenhou-json",
    "crates/mjlog2json-core",
    "crates/convlog", "dataset/mjai-validator",
]

[lints.clippy]
# Baseline: default `all` plus `pedantic` as warnings. Every `#[allow]`
# elsewhere in this repo carries a comment proving why the hit is safe.
all = "warn"
pedantic = "warn"
